<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 1024px;
        height: 1024px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .icon {
        width: 1024px;
        height: 1024px;
        border-radius: 224px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #101211;
      }

      img {
        width: 860px;
        height: 860px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <img src="../public/favicon.svg" alt="Attune">
    </div>
  </body>
</html>
