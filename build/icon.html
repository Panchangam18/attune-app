<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 1024px;
        height: 1024px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #101211;
        color: #ebe9e4;
      }

      img {
        width: 926px;
        height: 926px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="Attune">
  </body>
</html>
